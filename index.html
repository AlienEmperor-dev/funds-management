<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expenditure Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Expenditure Tracker</h1>
    </header>

    <div class="container">
      <!-- Display Current Account Info -->
      <section id="summary">
        <h2>Current Account Balance: <span id="accountBalance">0.00</span></h2>
        <h3>
          Current Monthly Expenditure: <span id="monthlyExpenditure">0.00</span>
        </h3>
      </section>

      <!-- Initial Account Balance and Currency Input -->
      <section id="initialBalanceForm">
        <h3>Enter Initial Account Balance (At the Start of Semester):</h3>
        <input
          type="number"
          id="initialBalance"
          placeholder="Enter initial balance"
          required
        />
        <h4>Select Currency:</h4>
        <select id="currencySelect">
          <option value="USD">USD ($)</option>
          <option value="EUR">EUR (€)</option>
          <option value="GBP">GBP (£)</option>
          <option value="INR">INR (₹)</option>
          <option value="KES">Ksh (KES)</option>
          <!-- Kenyan Shilling Option -->
        </select>
        <button id="setInitialBalanceBtn">Set Initial Balance</button>
      </section>

      <!-- Weekly Expenditure Input -->
      <section id="expenseForm">
        <h3>Enter Daily Expenditure</h3>
        <form id="expenseFormElement">
          <label for="day">Date (YYYY-MM-DD):</label>
          <input type="text" id="day" required /><br /><br />

          <label for="category">Category:</label>
          <select id="category">
            <option value="transport">Transport</option>
            <option value="food">Food</option>
            <option value="entertainment">Entertainment</option>
            <option value="utilities">Utilities</option></select
          ><br /><br />

          <label for="amount">Amount:</label>
          <input type="number" id="amount" required /><br /><br />

          <button type="submit">Submit</button>
        </form>
      </section>

      <!-- Option to Add More Funds -->
      <section id="addFundsForm">
        <h3>Add More Funds to Your Account:</h3>
        <input
          type="number"
          id="addFunds"
          placeholder="Enter amount to add"
          required
        />
        <button id="addFundsBtn">Add Funds</button>
      </section>

      <!-- Monthly Expenditure Summary -->
      <section id="results">
        <h2>Monthly Summary</h2>
        <div id="monthlySummary"></div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
